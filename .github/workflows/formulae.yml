name: formulae

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: formulae-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  homebrew:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Update Homebrew
        # The runner image's core snapshot can be behind, and HOMEBREW_NO_AUTO_UPDATE
        # keeps it there. `lucius` needs bun >= 1.4.2; the stale snapshot poured 1.4.0
        # and its `test do` refused to run (STARK-8070). This must run BEFORE the tap
        # is registered below: `brew update` fetches every registered tap, and the
        # symlinked PR checkout has no fetchable upstream, which fails the step.
        run: brew update
      - name: Register the PR checkout as the tap
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/21starkcom"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/21starkcom/homebrew-tap"
      - name: Style
        env:
          HOMEBREW_GITHUB_API_TOKEN: style-only-placeholder
        run: brew style Formula Casks scripts
      - name: Missing and whitespace-only token diagnostics
        run: brew ruby scripts/verify-auth.rb
      - name: Audit, install, and test every formula
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_RELEASE_READ_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_GITHUB_API_TOKEN" ]]; then
            echo 'Configure HOMEBREW_RELEASE_READ_TOKEN with contents:read access to the private release repositories.' >&2
            exit 1
          fi
          for path in Formula/*.rb; do
            name="${path##*/}"
            formula="21StarkCom/tap/${name%.rb}"
            brew audit --strict "$formula"
            brew install "$formula"
            brew test "$formula"
          done
      - name: Verify authenticated preflight and partial resume
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_RELEASE_READ_TOKEN }}
          HOMEBREW_CACHE: ${{ runner.temp }}/hermod-download-check
        run: brew ruby scripts/verify-download.rb
