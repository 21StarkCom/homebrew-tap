name: formulae

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # A manual run audits and fetches every entry, as a run that changes
  # scripts/ or this file does.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter reads the PR's changed-files list

concurrency:
  # Each push to main has a group of its own commit, so a newer push never
  # cancels it, not even while it waits: its `changes` job diffs it against
  # the commit before it, and nothing else would check its files.
  group: formulae-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A bump PR changes one entry. The audit and the fetch read only the entries
  # that changed; a change of scripts/ or of this file runs every entry and the
  # token checks. A run that changes no entry and no script skips the homebrew
  # job, and the run still concludes success for bump.sh --merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.filter.outputs.all }}
      formulae: ${{ steps.filter.outputs.formulae }}
      formulae_files: ${{ steps.filter.outputs.formulae_files }}
      casks: ${{ steps.filter.outputs.casks }}
      casks_files: ${{ steps.filter.outputs.casks_files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          list-files: shell
          filters: |
            all:
              - 'scripts/**'
              - '.github/workflows/formulae.yml'
            formulae:
              - added|modified: 'Formula/*.rb'
            casks:
              - added|modified: 'Casks/*.rb'
              - added|modified: 'Casks/*/*.rb'

  homebrew:
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success'
      || needs.changes.outputs.all == 'true' || needs.changes.outputs.formulae == 'true'
      || needs.changes.outputs.casks == 'true') }}
    # Homebrew on Linux, not a macOS runner. Every entry but the Formula/*-linux.rb
    # ones (Linux x86_64, audited as that below) is macOS-only (`depends_on
    # :macos` or `macos:`), and Linux Homebrew styles, audits and fetches them (a
    # fetch checks the download against the pinned sha256) but cannot install them.
    # What left CI with the macOS runner: `brew install` and `brew test` of every
    # formula, and the gh-login step's reinstall and test of stark-statusline, which
    # proved that Homebrew's sandboxed build and test workers never look a token up.
    # CLAUDE.md's Commands run those on a Mac. Arm, not x86: every cask is
    # `depends_on arch: :arm64`, and on another arch `brew fetch --cask` skips it with
    # a warning and exits 0, downloading nothing.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # Fail closed: a run whose `changes` failed checks every entry.
      FULL: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.all == 'true' }}
      FORMULAE_FILES: ${{ needs.changes.outputs.formulae_files }}
      CASKS_FILES: ${{ needs.changes.outputs.casks_files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Put the runner's Homebrew on PATH
        # The ubuntu image installs Homebrew in /home/linuxbrew/.linuxbrew, off PATH.
        run: echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"
      - name: Update Homebrew
        # The runner image's Homebrew can be behind, and HOMEBREW_NO_AUTO_UPDATE keeps
        # it there, so style and audit would check against old rules. This must run
        # BEFORE the tap is registered below: `brew update` git-fetches every
        # registered tap, and the symlinked PR checkout points at a private repo with
        # no credentials (persist-credentials: false), so that fetch fails the whole
        # step even though Homebrew updated. Don't "fix" it by persisting the checkout
        # token. HOMEBREW_NO_AUTO_UPDATE keeps the later steps from re-triggering it.
        run: brew update
      - name: Register the PR checkout as the tap
        # And trust it: Homebrew loads an untrusted tap's formula or cask only for a
        # command line that names it in full, and a `brew ruby` script names none.
        # CI runs this checkout's code either way.
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/21starkcom"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/21starkcom/homebrew-tap"
          brew trust --tap 21StarkCom/tap
      - name: Style
        env:
          HOMEBREW_GITHUB_API_TOKEN: style-only-placeholder
        run: brew style Formula Casks scripts
      - name: Missing and whitespace-only token diagnostics
        if: env.FULL == 'true'
        run: brew ruby scripts/verify-auth.rb
      - name: Audit and fetch the changed formulae (every formula on a full run)
        if: env.FULL == 'true' || needs.changes.outputs.formulae == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_RELEASE_READ_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_GITHUB_API_TOKEN" ]]; then
            echo 'Configure HOMEBREW_RELEASE_READ_TOKEN with contents:read access to the private release repositories.' >&2
            exit 1
          fi
          formulae=()
          macos=()
          linux=()
          # A <tool>-linux formula is <tool>'s Linux x86_64 build, for the devbox.
          paths=(Formula/*.rb)
          if [[ "$FULL" != true ]]; then
            # shellcheck disable=SC2206 # dorny/paths-filter shell-escapes the list
            paths=($FORMULAE_FILES)
          fi
          for path in "${paths[@]}"; do
            name="${path##*/}"
            name="${name%.rb}"
            formulae+=("21StarkCom/tap/${name}")
            if [[ "$name" = *-linux ]]; then
              linux+=("21StarkCom/tap/${name}")
            else
              macos+=("21StarkCom/tap/${name}")
            fi
          done
          # Audit as the platform users install on: some checks run only for the
          # OS and arch being audited.
          brew audit --strict --os=tahoe --arch=arm "${macos[@]}"
          # Named formulae only: a bare `brew audit` audits every formula it can find.
          if ((${#linux[@]})); then
            brew audit --strict --os=linux --arch=intel "${linux[@]}"
          fi
          # The download check `brew install` used to make: each asset is readable
          # and matches its pinned sha256. One call downloads them concurrently.
          # Never add --os or --arch: with either, brew fetch looks only for a bottle,
          # which no entry has, and exits 0 having downloaded nothing.
          brew fetch "${formulae[@]}"
          for formula in "${linux[@]}"; do
            name="${formula##*/}"
            tool="${name%-linux}"
            # A formula fetch checks no platform requirement today, so an x86_64-only
            # formula downloads on this arm runner like the macOS entries do. Fail if
            # a later Homebrew skips it with exit 0, as it skips an excluded cask.
            cache="$(brew --cache "$formula")"
            if [[ ! -s "$cache" ]]; then
              echo "${formula}: brew fetch downloaded nothing" >&2
              exit 1
            fi
            # The bumper's default asset is the macOS zip, so a bump run without the
            # entry's --asset-suffix (the README's caller table) pins a Mach-O whose
            # id and sha256 agree, and the fetch above passes it. Require the binary
            # named by the formula without -linux to be a Linux x86-64 executable.
            unzip -q -o "$cache" "$tool" -d "$RUNNER_TEMP/$name"
            format="$(file -b "$RUNNER_TEMP/$name/$tool")"
            if [[ "$format" != *"ELF 64-bit LSB "*"executable, x86-64,"* ]]; then
              echo "${formula}: the pinned asset's ${tool} is not a Linux x86-64 executable: $format" >&2
              exit 1
            fi
            echo "${formula}: ${tool} is a Linux x86-64 executable"
          done
      - name: Fetch and audit the changed casks (every cask on a full run)
        if: env.FULL == 'true' || needs.changes.outputs.casks == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_RELEASE_READ_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_GITHUB_API_TOKEN" ]]; then
            echo 'Configure HOMEBREW_RELEASE_READ_TOKEN with contents:read access to the private release repositories.' >&2
            exit 1
          fi
          # A cask in Casks/<first character>/ too (Casks/i/idavoll.rb): Homebrew
          # reads Casks/**/*.rb. A glob with no match stays as its pattern.
          paths=(Casks/*.rb Casks/*/*.rb)
          if [[ "$FULL" != true ]]; then
            # shellcheck disable=SC2206 # dorny/paths-filter shell-escapes the list
            paths=($CASKS_FILES)
          fi
          for path in "${paths[@]}"; do
            [[ -f "$path" ]] || continue
            name="${path##*/}"
            name="${name%.rb}"
            cask="21StarkCom/tap/${name}"
            # Every cask pins its release by numeric asset id, a URL this audit reads
            # as unversioned and so wants `sha256 :no_check`. The pinned sha256 is the
            # only check on the asset, and the fetch below verifies it.
            except=sha256_no_check_if_unversioned
            case "$name" in
              # homebrew/core has an unrelated `atlas` formula. The cask is only
              # ever installed as 21StarkCom/tap/atlas.
              atlas) except+=,token_conflicts ;;
            esac
            brew fetch --cask "$cask"
            # A cask whose `depends_on arch:` excludes this runner is skipped with a
            # warning, exit 0: require the download. Ask `brew --cache` as macOS arm64,
            # since it prints nothing for a macOS-only cask on Linux.
            if [[ ! -s "$(brew --cache --cask --os=tahoe --arch=arm "$cask")" ]]; then
              echo "${cask}: brew fetch --cask downloaded nothing" >&2
              exit 1
            fi
            brew audit --cask --strict --os=tahoe --arch=arm --except="$except" "$cask"
            echo "${cask}: fetched and audited"
          done
      - name: Fetch with a gh login alone
        if: env.FULL == 'true'
        # No HOMEBREW_GITHUB_API_TOKEN here: entries fall back to `gh auth token`
        # (STARK-10632). Homebrew's lookup runs its own gh first, so install it as a
        # user would; the runner's gh shares its config and would answer too.
        env:
          RELEASE_READ_TOKEN: ${{ secrets.HOMEBREW_RELEASE_READ_TOKEN }}
        run: |
          unset HOMEBREW_GITHUB_API_TOKEN
          brew install gh
          "$(brew --prefix)/bin/gh" auth login --with-token --insecure-storage <<<"$RELEASE_READ_TOKEN"
          unset RELEASE_READ_TOKEN
          # Prove the token comes from gh, not a stray env var or keychain entry.
          brew ruby -e 'source = GitHub::API.credentials_type
            abort "token source is #{source}, not the gh login" unless source == :github_cli_token'
          brew fetch --force 21StarkCom/tap/stark-statusline
          brew fetch --force --cask 21StarkCom/tap/mimir
      - name: Verify authenticated preflight and partial resume
        if: env.FULL == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_RELEASE_READ_TOKEN }}
          HOMEBREW_CACHE: ${{ runner.temp }}/hermod-download-check
        run: brew ruby scripts/verify-download.rb
