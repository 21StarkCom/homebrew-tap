name: mirror

# Copies every entry of this tap, with its release asset, into
# GetEvinced/homebrew-tap (docs/specs/getevinced-mirror.md, epic STARK-13601),
# then fetches the changed copies from GetEvinced to prove they download. No
# pull_request trigger: bump.yml, a gate workflow, runs scripts/test-mirror.sh, so
# this file stays out of bump.sh's GATE_WORKFLOWS. The App key lives in the
# Environment getevinced-mirror, which only main can use (D10), and each job also
# refuses any other ref, so a dispatch on another branch skips both jobs.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # The daily safety net: heals a run that failed, and fetches every copy.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  # One run on main at a time; GitHub keeps one pending run, and a newer one
  # replaces it. A dispatch on another ref (whose jobs skip) gets a group of its
  # own, so it cannot replace a pending main run.
  group: ${{ github.ref == 'refs/heads/main' && 'mirror' || format('mirror-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: getevinced-mirror
    # The first run copies 1.54 GB (D11 leaves out 0.93 GB); a frigg release
    # (frigg and frigg-linux) copies ~0.85 GB.
    timeout-minutes: 90
    outputs:
      formulae: ${{ steps.mirror.outputs.formulae }}
      casks: ${{ steps.mirror.outputs.casks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # main's tip, not the run's commit: checkout points origin/main at the
          # commit it checks out, so mirror.sh's HEAD == origin/main check cannot
          # stop a re-run of an older run from copying an older main over a newer.
          ref: main
          persist-credentials: false
      - name: Mint a GetEvinced/homebrew-tap token
        id: app
        # app-id is deprecated in v3; the Environment holds the App's Client ID.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GETEVINCED_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.GETEVINCED_TAP_APP_KEY }}
          owner: GetEvinced
          repositories: homebrew-tap
          permission-contents: write
      - name: Name the App's bot as the committer
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)"
          echo "name=${SLUG}[bot]" >>"$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >>"$GITHUB_OUTPUT"
      - name: Mirror
        id: mirror
        env:
          MIRROR_SOURCE_TOKEN: ${{ secrets.HOMEBREW_RELEASE_READ_TOKEN }}
          MIRROR_TARGET_TOKEN: ${{ steps.app.outputs.token }}
          MIRROR_GIT_NAME: ${{ steps.bot.outputs.name }}
          MIRROR_GIT_EMAIL: ${{ steps.bot.outputs.email }}
        run: scripts/mirror.sh

  verify:
    needs: sync
    # After a partial failure too (!cancelled()), for the entries sync did push. A
    # scheduled or manual run checks every copy; a push run, the changed ones.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.sync.result != 'skipped' &&
      (github.event_name != 'push' || needs.sync.outputs.formulae != '' || needs.sync.outputs.casks != '')
    # Arm, as in formulae.yml: on x86 `brew fetch --cask` skips an arm64-only cask.
    runs-on: ubuntu-24.04-arm
    environment: getevinced-mirror
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Put the runner's Homebrew on PATH
        run: echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"
      - name: Update Homebrew
        # Before the tap is registered, as in formulae.yml: `brew update` fetches
        # every registered tap, and this checkout keeps no credentials.
        run: brew update
      - name: Mint a read token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GETEVINCED_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.GETEVINCED_TAP_APP_KEY }}
          owner: GetEvinced
          repositories: homebrew-tap
          permission-contents: read
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GetEvinced/homebrew-tap
          token: ${{ steps.app.outputs.token }}
          path: getevinced-tap
          persist-credentials: false
      - name: Register it as the tap getevinced/tap
        # And trust it: Homebrew 7 loads no formula from a tap it does not trust.
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/getevinced"
          ln -s "$GITHUB_WORKSPACE/getevinced-tap" "$(brew --repository)/Library/Taps/getevinced/homebrew-tap"
          brew trust --tap GetEvinced/tap
      - name: Pick the copies to check
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          FORMULAE: ${{ needs.sync.outputs.formulae }}
          CASKS: ${{ needs.sync.outputs.casks }}
        run: |
          marker='# Mirrored from 21StarkCom/homebrew-tap by scripts/mirror.sh. Do not edit: the next run overwrites it.'
          marked() { grep -lxF -- "$marker" getevinced-tap/"$1"/*.rb 2>/dev/null | sed -E 's#.*/##; s#\.rb$##' | tr '\n' ' '; }
          if [[ "$EVENT" != push ]]; then
            FORMULAE="$(marked Formula)"
            CASKS="$(marked Casks)"
            # No marked file: an empty tap, or a $marker that no longer matches
            # scripts/mirror.sh's MARKER. Fail rather than check nothing and pass.
            if [[ -z "${FORMULAE// /}${CASKS// /}" ]]; then
              echo "getevinced-tap holds no file with the mirror marker; does \$marker still match scripts/mirror.sh's MARKER?" >&2
              exit 1
            fi
          fi
          echo "formulae=$FORMULAE" >>"$GITHUB_OUTPUT"
          echo "casks=$CASKS" >>"$GITHUB_OUTPUT"
          echo "checking formulae: ${FORMULAE:-none}; casks: ${CASKS:-none}"
      - name: Style the copies
        env:
          HOMEBREW_GITHUB_API_TOKEN: style-only-placeholder
          FORMULAE: ${{ steps.pick.outputs.formulae }}
          CASKS: ${{ steps.pick.outputs.casks }}
        # Not FormulaAudit/DependencyOrder: the copy renames 21starkcom/tap/<x> to
        # getevinced/tap/<x>, which sorts after `arch` where the source sorted
        # before it (librarian), and the order changes no install.
        run: |
          paths=()
          for f in $FORMULAE; do paths+=("getevinced-tap/Formula/$f.rb"); done
          for c in $CASKS; do paths+=("getevinced-tap/Casks/$c.rb"); done
          ((${#paths[@]} == 0)) || brew style --except-cops FormulaAudit/DependencyOrder "${paths[@]}"
      - name: Fetch the copies with a token that reads GetEvinced only
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app.outputs.token }}
          FORMULAE: ${{ steps.pick.outputs.formulae }}
          CASKS: ${{ steps.pick.outputs.casks }}
        run: |
          # Each fetch checks the download against the pinned sha256. Never add --os
          # or --arch: brew fetch then looks only for a bottle and downloads nothing.
          # One call downloads the formulae concurrently, as in formulae.yml.
          refs=()
          for f in $FORMULAE; do refs+=("getevinced/tap/$f"); done
          ((${#refs[@]} == 0)) || brew fetch "${refs[@]}"
          for f in $FORMULAE; do
            [[ "$f" == *-linux ]] || continue
            # The same check as formulae.yml: a -linux copy holds a Linux x86-64 tool.
            tool="${f%-linux}"
            cache="$(brew --cache "getevinced/tap/$f")"
            [[ -s "$cache" ]] || { echo "getevinced/tap/$f: brew fetch downloaded nothing" >&2; exit 1; }
            unzip -q -o "$cache" "$tool" -d "$RUNNER_TEMP/$f"
            format="$(file -b "$RUNNER_TEMP/$f/$tool")"
            [[ "$format" == *"ELF 64-bit LSB "*"executable, x86-64,"* ]] ||
              { echo "getevinced/tap/$f: $tool is not a Linux x86-64 executable: $format" >&2; exit 1; }
            echo "getevinced/tap/$f: $tool is a Linux x86-64 executable"
          done
          for c in $CASKS; do
            cask="getevinced/tap/$c"
            brew fetch --cask "$cask"
            # As in formulae.yml: a cask Homebrew skips exits 0 having downloaded
            # nothing. Ask --cache as macOS arm64: it prints nothing for one on Linux.
            [[ -s "$(brew --cache --cask --os=tahoe --arch=arm "$cask")" ]] ||
              { echo "$cask: brew fetch --cask downloaded nothing" >&2; exit 1; }
            echo "$cask: fetched"
          done
